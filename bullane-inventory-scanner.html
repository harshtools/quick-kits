<!DOCTYPE html>
<html>
<head>
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Bullane Inventory Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    button {
      flex: 1;
      padding: 15px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #outBtn {
      background: #111;
      color: white;
    }

    #rtoBtn {
      background: #777;
      color: white;
    }

    #scanner {
      width: 100%;
      max-width: 500px;
      margin: auto;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }

    #status {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
    }

    #lastScan {
      margin-top: 10px;
      font-size: 20px;
      color: #333;
    }

    .selected {
      outline: 4px solid #2196f3;
    }
  </style>
</head>

<body>

  <h2>Bullane Inventory</h2>

  <div class="buttons">

    <button id="outBtn" onclick="selectEntry('OUT')">
      OUT ENTRY
    </button>

    <button id="rtoBtn" onclick="selectEntry('RTO')">
      RTO ENTRY
    </button>

  </div>

  <div id="scanner"></div>

  <div id="status">
    Select OUT or RTO
  </div>

  <div id="lastScan">
    Ready
  </div>


<script>

  // =========================================
  // PUT YOUR APPS SCRIPT WEB APP URL HERE
  // =========================================

  const APP_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycby6HEERWlvcrZWUppWLYmv18af-nhFZNVknRiawrkhg2wO97O4YtGx4OBhQEG8aQrcD/exec";


  // Same token used in Apps Script
  const SCANNER_TOKEN =
    "BullaneScanner2026";


  let selectedType = "";
  let scanner = null;
  let lastScanned = "";
  let lastScanTime = 0;


  function selectEntry(type) {

    selectedType = type;

    document
      .getElementById("outBtn")
      .classList.remove("selected");

    document
      .getElementById("rtoBtn")
      .classList.remove("selected");

    if (type === "OUT") {
      document
        .getElementById("outBtn")
        .classList.add("selected");
    } else {
      document
        .getElementById("rtoBtn")
        .classList.add("selected");
    }

    document.getElementById("status").innerText =
      type === "OUT"
        ? "Scanning OUT ENTRY"
        : "Scanning RTO ENTRY";

    startScanner();
  }


  function startScanner() {

    if (scanner) {
      return;
    }

    scanner = new Html5Qrcode("scanner");

    const config = {

      fps: 15,

      qrbox: {
        width: 280,
        height: 150
      },

      formatsToSupport: [

        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.ITF

      ]
    };


    scanner.start(

      {
        facingMode: "environment"
      },

      config,

      function(decodedText) {

        handleBarcode(decodedText);

      },

      function(errorMessage) {

        // Ignore normal scanning errors

      }

    ).catch(function(error) {

      document.getElementById("status").innerText =
        "Camera error: " + error;

    });
  }


  function handleBarcode(sku) {

    if (!selectedType) {
      return;
    }

    const now = Date.now();

    // Prevent the same barcode from being sent repeatedly
    // within 1.5 seconds

    if (
      sku === lastScanned &&
      now - lastScanTime < 1500
    ) {
      return;
    }

    lastScanned = sku;
    lastScanTime = now;


    // Clean SKU

    sku = String(sku)
      .replace(/\u00A0/g, "")
      .replace(/\s+/g, "")
      .trim();


    document.getElementById("lastScan").innerText =
      "Scanned: " + sku;


    document.getElementById("status").innerText =
      "Saving " + sku + "...";


    // Send to Apps Script

    fetch(APP_SCRIPT_URL, {

      method: "POST",

      mode: "no-cors",

      headers: {
        "Content-Type": "text/plain;charset=UTF-8"
      },

      body: JSON.stringify({

        sku: sku,

        entryType: selectedType,

        token: SCANNER_TOKEN

      })

    })
    .then(function() {

      document.getElementById("status").innerText =
        selectedType + " ENTRY — Ready for next scan";

      // Beep

      try {

        const audio =
          new Audio(
            "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA="
          );

        audio.play().catch(() => {});

      } catch (e) {}

      // Vibrate phone

      if (navigator.vibrate) {
        navigator.vibrate(100);
      }

    })
    .catch(function(error) {

      document.getElementById("status").innerText =
        "Send error";

      console.log(error);

    });

  }

</script>

</body>
</html>
